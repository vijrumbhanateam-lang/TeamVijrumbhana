
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Vijrumbhana Membership</title>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>TEAM VIJRUMBHANA</h1>
  <h2>Membership Registration</h2>

  <form id="membershipForm">

    <label>Student Name</label>
    <input type="text" name="studentName" required>

    <label>Class</label>
    <input type="text" name="className" required>

    <label>Section</label>
    <input type="text" name="section" required>

    <label>Roll Number</label>
    <input type="text" name="rollNumber" required>

    <label>Mobile Number</label>
    <input type="tel" name="mobile" required>

    <label>Email</label>
    <input type="email" name="email" required>

    <label>Why do you want to join?</label>
    <textarea name="reason" required></textarea>

    <label>Your Skills</label>
    <textarea name="skills" required></textarea>

    <button type="submit">Submit Application</button>

  </form>

  <p id="message"></p>

  <script>
    const GOOGLE_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbxueOTcQAwyVHdjVX5LRdi1cdH4HleUTtWHDk0XuHFL_FBo1qUTmUXiKXXQV2jnn3jB/exec";

    document.getElementById("membershipForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const form = event.target;
        const message = document.getElementById("message");

        const data = {
          studentName: form.studentName.value.trim(),
          className: form.className.value.trim(),
          section: form.section.value.trim(),
          rollNumber: form.rollNumber.value.trim(),
          mobile: form.mobile.value.trim(),
          email: form.email.value.trim(),
          reason: form.reason.value.trim(),
          skills: form.skills.value.trim()
        };

        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
              "Content-Type": "text/plain;charset=UTF-8"
            },
            body: JSON.stringify(data)
          });

          message.textContent =
            "Application submitted! The team will review it.";

          form.reset();

        } catch (error) {
          message.textContent =
            "Unable to submit. Please try again.";
        }
      });
  </script>

</body>
</html>
